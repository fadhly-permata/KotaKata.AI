<!-- Interactive Sparkles JS -->
<script>
        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.95) {
                createSparkle(e.clientX, e.clientY);
            }
        });

        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'absolute pointer-events-none text-primary/40';
            sparkle.innerHTML = '<span class="material-symbols-outlined" style="font-size: ' + (Math.random() * 10 + 10) + 'px; font-variation-settings: \'FILL\' 1;">sparkles</span>';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            document.body.appendChild(sparkle);

            const animation = sparkle.animate([
                { transform: 'translate(0, 0) scale(0)', opacity: 0 },
                { transform: `translate(${(Math.random() - 0.5) * 50}px, ${(Math.random() - 0.5) * 50}px) scale(1)`, opacity: 0.8, offset: 0.5 },
                { transform: `translate(${(Math.random() - 0.5) * 100}px, ${(Math.random() - 0.5) * 100}px) scale(0)`, opacity: 0 }
            ], {
                duration: 1000 + Math.random() * 1000,
                easing: 'ease-out'
            });

            animation.onfinish = () => sparkle.remove();
        }
    </script>
