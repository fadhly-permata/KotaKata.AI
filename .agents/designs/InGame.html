<script>
        function setActiveCell(element) {
            // Remove active classes from all cells
            const cells = document.querySelectorAll('.crossword-grid > div');
            cells.forEach(cell => {
                if (cell.classList.contains('bg-primary')) {
                    cell.classList.remove('bg-primary', 'border-4', 'border-primary-fixed', 'text-white', 'shadow-[0_4px_12px_rgba(224,64,160,0.4)]', 'z-10', 'scale-110');
                    cell.classList.add('bg-white', 'border-2', 'border-outline-variant', 'text-on-surface', 'bouncy-hover', 'cursor-pointer');
                    // Reset small number color
                    const num = cell.querySelector('span');
                    if (num) {
                        num.classList.remove('text-white');
                        num.classList.add('text-outline');
                    }
                }
            });

            // Add active classes to clicked cell
            element.classList.remove('bg-white', 'border-2', 'border-outline-variant', 'text-on-surface', 'bouncy-hover', 'cursor-pointer');
            element.classList.add('bg-primary', 'border-4', 'border-primary-fixed', 'text-white', 'shadow-[0_4px_12px_rgba(224,64,160,0.4)]', 'z-10', 'scale-110');
            
            const num = element.querySelector('span');
            if (num) {
                num.classList.remove('text-outline');
                num.classList.add('text-white');
            }
        }
    </script>
